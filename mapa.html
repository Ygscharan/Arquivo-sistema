<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estoque ERP — Mapa de Prateleiras</title>
    <link rel="stylesheet" href="estoque.css">
</head>
<body>

<button class="btn-voltar" onclick="voltarPagina()" title="Voltar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"></line>
    <polyline points="12 19 5 12 12 5"></polyline>
  </svg>
  Voltar
</button>

<header>
    <div>📦 ERP Estoque <span id="syncLabel" class="status-sync">...</span></div>
    <div class="hamburger" id="hamburger" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    <nav class="menu" id="menu">
        <a href="dashboard.html" class="menu-link" onclick="fecharMenuDropdown()">📊 Dashboard</a>
        <a href="lancamento.html" class="menu-link" onclick="fecharMenuDropdown()">📝 Lançamento de Caixa</a>
        <a href="index.html" class="menu-link" onclick="fecharMenuDropdown()">📋 Lista de Caixas</a>
        <a href="avulsas.html" class="menu-link" onclick="fecharMenuDropdown()">📦 Gestão de Avulsas</a>
        <a href="mapa.html" class="menu-link" onclick="fecharMenuDropdown()">🗺️ Mapa de Prateleiras</a>
        <a href="config.html" class="menu-link" onclick="fecharMenuDropdown()">⚙️ Config. Prateleiras</a>
        <a href="processos.html" class="menu-link" onclick="fecharMenuDropdown()">📂 Gerenciar Processos</a>
        <a href="unidades.html" class="menu-link" onclick="fecharMenuDropdown()">🏢 Gerenciar Unidades</a>
        <a href="responsaveis.html" class="menu-link" onclick="fecharMenuDropdown()">👥 Gerenciar Responsáveis</a>
        <hr>
        <button type="button" onclick="selecionarPasta()">📂 Alterar Pasta</button>
    </nav>
</header>

<div id="barraReconectarPasta" role="region" aria-label="Reconectar pasta de dados">
    <span id="barraReconectarTexto"></span>
    <button type="button" class="btn-prim" onclick="reconectarPastaSalva()">Permitir acesso à pasta salva</button>
    <button type="button" class="btn-sec" onclick="escolherOutraPastaManual()">Escolher outra pasta…</button>
</div>

<div class="container">
    <div id="mapaTela">
        <h2>🗺️ Mapa de Ocupação</h2>
        <div class="card" style="margin-left: auto; margin-right: auto; max-width: 1360px; display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
    <label for="buscarPrateleiraMapa" style="font-weight: bold; color: #2c3e50;">🔍 Buscar Prateleira:</label>
    <input type="text" id="buscarPrateleiraMapa" placeholder="Digite o nome (Ex: PRAT-0010)" onkeyup="buscarNoMapa()" style="flex: 1; padding: 10px; font-size: 15px;">
</div>
        
        <div class="legenda-container">
            <span class="legenda-titulo">Legenda de Status:</span>
            <div class="legenda-item">
                <div class="legenda-cor cor-vazio"></div> <span>Vazio / Livre</span>
            </div>
            <div class="legenda-item">
                <div class="legenda-cor cor-guardada"></div> <span>Guardada</span>
            </div>
            <div class="legenda-item">
                <div class="legenda-cor cor-preparada"></div> <span>Em Preparação</span>
            </div>
            <div class="legenda-item">
                <div class="legenda-cor cor-digitalizada"></div> <span>Digitalizada</span>
            </div>
        </div>
        
        <div id="mapa"></div>
    </div>
</div>

<div class="modal" id="modal"><div class="modalBox" id="modalConteudo"></div></div>

<script>window.ERP_PAGE_ID = "mapa";</script>
<script src="estoque-app.js"></script>
</body>
</html>
